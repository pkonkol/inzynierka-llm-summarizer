<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <title>Podsumowania</title>
    <link rel="stylesheet" href="sidepanel.css" />
    <script type="module" src="sidepanel.js"></script>
  </head>
  <body>
    <header class="panel-header">
      <h1>Podsumowania</h1>
      <button
        id="history-toggle"
        type="button"
        aria-controls="history"
        aria-expanded="false"
        aria-label="Historia"
        title="Historia"
      >
        <span aria-hidden="true">🕘</span>
      </button>
    </header>

    <main>
      <section id="result" aria-live="polite"></section>
      <section id="history" aria-label="Historia" hidden></section>
    </main>

    <form id="summary-form">
      <fieldset>
        <legend>Źródło</legend>
        <label><input type="radio" name="source" value="url" checked /> Adres strony</label>
        <label><input type="radio" name="source" value="pageText" /> Treść strony</label>
      </fieldset>

      <div class="form-row">
        <label>
          Rodzaj
          <select id="preset" name="preset"></select>
        </label>
        <label>
          Język
          <select id="language" name="language"></select>
        </label>
      </div>

      <label for="density">Długość: <span id="density-label"></span></label>
      <input id="density" name="density" type="range" min="0" max="1" step="0.05" />

      <label><input id="check-facts" name="checkFacts" type="checkbox" /> Sprawdź fakty</label>

      <button id="submit" type="submit" disabled>Podsumuj tę stronę</button>
      <p id="error" role="alert" hidden></p>
    </form>
  </body>
</html>
