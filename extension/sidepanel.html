<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <title>Podsumowania</title>
    <link rel="stylesheet" href="sidepanel.css" />
    <script type="module" src="sidepanel.js"></script>
  </head>
  <body>
    <header class="panel-header">
      <h1>Podsumowania</h1>
      <button
        id="history-toggle"
        type="button"
        aria-controls="history"
        aria-expanded="false"
        aria-label="Historia"
        title="Historia"
      >
        <span aria-hidden="true">🕘</span>
      </button>
    </header>

    <main>
      <section id="result" aria-live="polite" aria-label="Wynik" tabindex="0"></section>
      <section id="history" aria-label="Historia" hidden></section>
    </main>

    <form id="summary-form">
      <textarea
        id="source-field"
        name="sourceField"
        rows="2"
        aria-label="Źródło"
        placeholder="Puste: ta strona. Albo wklej adres lub tekst."
      ></textarea>

      <fieldset id="preset-options">
        <legend class="visually-hidden">Rodzaj</legend>
      </fieldset>

      <div class="settings-row">
        <label for="density">Długość: <span id="density-label"></span></label>
        <input id="density" name="density" type="range" min="0" max="1" step="0.05" />
        <label class="inline-field">
          Język
          <select id="language" name="language"></select>
        </label>
      </div>

      <div class="actions">
        <button type="submit" name="action" value="summarize" disabled>Podsumuj</button>
        <button type="submit" name="action" value="check_facts" disabled>Sprawdź fakty</button>
        <a id="open-on-page" target="_blank" rel="noopener" hidden>Otwórz na stronie</a>
      </div>
      <p id="error" role="alert" hidden></p>
    </form>
  </body>
</html>
