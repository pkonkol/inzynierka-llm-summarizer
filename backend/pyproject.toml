[project]
name = "inzynierka-backend"
version = "0.1.0"
requires-python = "==3.14.*"
dependencies = [
    "fastapi~=0.135",
    "uvicorn~=0.44",
    "structlog~=26.1",
    "pydantic-settings~=2.13",
    "trafilatura~=2.0",
    "motor~=3.7",
    "pyjwt~=2.15",
    "langchain-core~=1.4",
    "langchain-google-genai~=4.2",
    "langchain-openai~=1.3",
    "langchain-ollama~=1.1",
    "textstat~=0.7.13",
    "deepeval~=4.1",
    "rouge-score~=0.1.2",
    "nltk~=3.10",
]

[dependency-groups]
dev = [
    "pytest~=9.0",
    "pytest-asyncio~=1.3",
    "watchfiles~=1.2.0", # Without it `uvicorn --reload` polls every file with stat() four times a second, which idles at half a core.
]

[tool.uv]
required-version = ">=0.12"

[tool.ruff]
target-version = "py314"
line-length = 100

# ruff also formats Python blocks inside Markdown; keep it away from the hand-written
# BAD/GOOD examples in CLAUDE.md.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes — undefined names, unused imports
    "I",   # isort — import grouping and ordering
    "UP",  # pyupgrade — modern syntax for the target version
    "B",   # flake8-bugbear — likely bugs
    "S",   # flake8-bandit — security (this is ruff's Bandit, not a separate tool)
    "T20", # flake8-print — no print() in application code
    "G",   # flake8-logging-format
    "ANN", # flake8-annotations — signatures carry types
    "RUF", # ruff-specific rules
]

# Deliberately off, so nobody turns them on "helpfully":
#   D      — docstrings are sparse on purpose; this would fire hundreds of times
#   TID252 — enforces absolute imports; app/ standardises on relative

[tool.ruff.lint.pycodestyle]
# Two limits on purpose: the formatter wraps code at line-length (100), so anything still
# over 200 is prose it cannot break — prompts, messages, URLs. Those read worse split.
max-line-length = 200

[tool.ruff.lint.flake8-bugbear]
# FastAPI expresses dependency injection as calls in argument defaults, which is exactly
# the pattern B008 exists to flag.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Security",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Form",
    "fastapi.File",
]

[tool.ruff.lint.per-file-ignores]
# Test suites assert; that is the point.
"tests/**" = ["S101"]
# The boundary where untyped LangChain and deepeval output is narrowed with isinstance/getattr.
"app/services/llm/_base.py" = ["ANN401"]
"app/services/metrics/deepeval.py" = ["ANN401"]

[tool.ruff.format]
docstring-code-format = true

[tool.pyrefly]
project-includes = ["app"]
preset = "default"
# deepeval re-exports LLMTestCaseParams as MultiTurnParams, dropping INPUT/ACTUAL_OUTPUT;
# textstat ships no stubs.
replace-imports-with-any = ["deepeval.*", "textstat"]

[tool.pytest.ini_options]
# rootdir is backend/, so `app` imports resolve without installing the package.
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
