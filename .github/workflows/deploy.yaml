# .github/workflows/deploy.yml
name: Deploy to GCP

on:
  push:
    branches: [master]
  workflow_dispatch:

# Least privilege at the top; jobs opt into more below. `id-token: write` mints a
# GCP-federated token, so it should not be workflow-wide.
permissions:
  contents: read

# Serialize deploys so two pushes cannot apply against the same Terraform state concurrently.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Same gates as ci.yml, defined once. Nothing ships without them.
  checks:
    uses: ./.github/workflows/checks.yml

  deploy-backend:
    needs: [checks]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Workload Identity Federation exchange with GCP
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/app/backend
      # Must match google_cloud_run_v2_service.backend in infra/terraform/main/cloudrun.tf
      SERVICE: llm-summarizer-backend
    outputs:
      vite_api_url: ${{ steps.tf_apply.outputs.vite_api_url }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }} # projects/NUMBER/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: ${{ vars.WIF_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet

      - name: Build & Push
        env:
          SHA: ${{ github.sha }}
        run: |
          docker build -t "$IMAGE:$SHA" ./backend
          docker tag "$IMAGE:$SHA" "$IMAGE:latest"
          docker tag "$IMAGE:$SHA" "$IMAGE:latest-github-actions"

      # Between build and push on purpose: a vulnerable image should never reach the
      # registry, where it becomes something that can be deployed by accident.
      - uses: extractions/setup-just@v3
      - name: Scan image
        env:
          SHA: ${{ github.sha }}
        run: just scan-image "$IMAGE:$SHA"

      - name: Push
        env:
          SHA: ${{ github.sha }}
        run: |
          docker push "$IMAGE:$SHA"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:latest-github-actions"

      - name: Report image vulnerabilities
        continue-on-error: true
        env:
          SHA: ${{ github.sha }}
        run: |
          gcloud artifacts docker images describe "$IMAGE:$SHA" \
            --show-package-vulnerability \
            --format="value(package_vulnerability_summary)" || true

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.5
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: infra/terraform/main
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_STATE_PREFIX: ${{ vars.TF_STATE_PREFIX }}
        run: |
          terraform init \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="prefix=$TF_STATE_PREFIX"

      # Captured before the apply so a failed deploy has somewhere to go back to. Cloud Run
      # keeps old revisions, so rolling back is a traffic switch, not a rebuild.
      - name: Record current revision
        id: previous
        run: |
          REVISION=$(gcloud run services describe "$SERVICE" --region "$REGION" \
            --format='value(status.traffic[0].revisionName)' 2>/dev/null || true)
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
          echo "Serving revision before deploy: ${REVISION:-<none, first deploy>}"

      - name: Terraform Apply
        id: tf_apply
        working-directory: infra/terraform/main
        env:
          SHA: ${{ github.sha }}
        run: |
          terraform plan -out=tfplan -var="image_tag=$SHA" --var-file=../common.tfvars
          terraform apply tfplan
          URL=$(terraform output -raw backend_url)
          echo "vite_api_url=$URL" >> "$GITHUB_OUTPUT"

      # `terraform apply` succeeding only means Cloud Run accepted the revision. Whether the
      # app actually starts is a different question, and the one users care about.
      - name: Smoke test
        id: smoke
        env:
          URL: ${{ steps.tf_apply.outputs.vite_api_url }}
        run: |
          curl --fail --silent --show-error \
               --retry 6 --retry-delay 5 --retry-all-errors \
               --max-time 15 "$URL/health"

      - name: Roll back on failed smoke test
        if: failure() && steps.smoke.outcome == 'failure' && steps.previous.outputs.revision != ''
        env:
          PREVIOUS: ${{ steps.previous.outputs.revision }}
        run: |
          echo "::error::Smoke test failed — returning all traffic to $PREVIOUS"
          gcloud run services update-traffic "$SERVICE" --region "$REGION" \
            --to-revisions="$PREVIOUS=100"

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: [deploy-backend]
    permissions:
      contents: read
      id-token: write # WIF exchange, so the firebase CLI can use ADC
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/app/frontend

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }} # projects/NUMBER/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: ${{ vars.WIF_SA_EMAIL }}
          export_environment_variables: true # sets GOOGLE_APPLICATION_CREDENTIALS for the firebase CLI

      - uses: google-github-actions/setup-gcloud@v2

      # `${{ }}` is substituted into the script text before the shell sees it, so a value
      # with metacharacters becomes code. `env:` hands over a variable instead.
      - name: Build
        working-directory: frontend
        env:
          URL: ${{ needs.deploy-backend.outputs.vite_api_url }}
        run: |
          test -n "$URL" || { echo "::error::vite_api_url is empty - backend job did not publish a URL"; exit 1; }
          echo "VITE_API_URL=$URL" > .env.production
          npm ci
          npm run build

      - name: Configure Firebase CLI
        run: npm install -g firebase-tools@14

      - name: Deploy to Firebase
        working-directory: frontend
        run: firebase deploy --only hosting --project "$PROJECT_ID" --non-interactive
