# `unpinned-uses` defaults to requiring a full commit SHA on every `uses:`. That is the
# right end state — a tag like @v4 is mutable, so whoever controls the account controls
# what it points at — but hash pins rot without Dependabot's github-actions ecosystem to
# bump them, so both land together or neither does.
#
# Until then: ref-pin, meaning every action must at least name a tag, never a bare branch.
# Flip "*" to hash-pin in the same change that adds .github/dependabot.yml.

rules:
  unpinned-uses:
    config:
      policies:
        "*": ref-pin
