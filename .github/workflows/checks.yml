# Reusable workflow holding every quality gate in one place.
#
# Two callers use it: ci.yml (on every push) and deploy.yaml (as the gate before a
# release). Defining it once is the point — a copy in each workflow would be exactly
# the drift this setup exists to prevent.
#
# Note what is NOT here: tool invocations. Every step is `just <recipe>`, so the flags
# live in the justfile and a local run executes the same thing this does.

name: Checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  # Skip work for areas a push did not touch. A skipped job still satisfies `needs:`,
  # so callers can depend on all of these unconditionally.
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      security: ${{ steps.filter.outputs.security }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'justfile'
            frontend:
              - 'frontend/**'
              - 'justfile'
            security:
              - 'backend/Dockerfile'
              - 'backend/requirements.txt'
              - 'frontend/package-lock.json'
              - 'infra/**'
              - 'justfile'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: extractions/setup-just@v3
      - uses: astral-sh/setup-uv@v6
      - run: just lint-backend

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: extractions/setup-just@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: just install-frontend
      - run: just lint-frontend

  # Secrets are scanned on every push regardless of paths: a leak can arrive in any file.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans history, not just the tip
          persist-credentials: false
      - uses: extractions/setup-just@v3
      - run: just scan-secrets

  security:
    needs: changes
    if: needs.changes.outputs.security == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: extractions/setup-just@v3
      - run: just scan-dockerfile
      - run: just scan-infra
      - run: just scan-deps

      # The gate above only fails on HIGH/CRITICAL. Everything below that is still worth
      # seeing, so publish it to the run summary rather than dropping it. On a private
      # repo without GitHub Code Security there is no Code Scanning tab to upload SARIF
      # to, and the step summary is the free equivalent.
      - name: Report findings below the gate
        if: always()
        run: |
          {
            echo "## Misconfiguration report (all severities)"
            echo '```'
            just report-infra 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
