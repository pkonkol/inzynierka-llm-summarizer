# .github/workflows/deploy.yml
name: Deploy to GCP

on:
  push:
    branches: [master]
  workflow_dispatch:

# Least privilege at the top; jobs that need more opt in individually below. `id-token:
# write` mints a GCP-federated OIDC token, so granting it workflow-wide would hand it to
# every job whether or not it talks to GCP.
permissions:
  contents: read

# Serialize deploys so two pushes cannot apply against the same Terraform state concurrently.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The quality gates, defined once in checks.yml and shared with ci.yml. Nothing ships
  # without them passing.
  checks:
    uses: ./.github/workflows/checks.yml

  deploy-backend:
    needs: [checks]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Workload Identity Federation exchange with GCP
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/app/backend
    outputs:
      vite_api_url: ${{ steps.tf_apply.outputs.vite_api_url }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }} # projects/NUMBER/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: ${{ vars.WIF_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet

      - name: Build & Push
        env:
          SHA: ${{ github.sha }}
        run: |
          docker build -t "$IMAGE:$SHA" ./backend
          docker tag "$IMAGE:$SHA" "$IMAGE:latest"
          docker tag "$IMAGE:$SHA" "$IMAGE:latest-github-actions"

      - name: Push
        env:
          SHA: ${{ github.sha }}
        run: |
          docker push "$IMAGE:$SHA"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:latest-github-actions"

      - name: Report image vulnerabilities
        continue-on-error: true
        env:
          SHA: ${{ github.sha }}
        run: |
          gcloud artifacts docker images describe "$IMAGE:$SHA" \
            --show-package-vulnerability \
            --format="value(package_vulnerability_summary)" || true

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.5
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: infra/terraform/main
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_STATE_PREFIX: ${{ vars.TF_STATE_PREFIX }}
        run: |
          terraform init \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="prefix=$TF_STATE_PREFIX"

      - name: Terraform Apply
        id: tf_apply
        working-directory: infra/terraform/main
        env:
          SHA: ${{ github.sha }}
        run: |
          terraform plan -out=tfplan -var="image_tag=$SHA" --var-file=../common.tfvars
          terraform apply tfplan
          URL=$(terraform output -raw backend_url)
          echo "vite_api_url=$URL" >> "$GITHUB_OUTPUT"

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: [deploy-backend]
    permissions:
      contents: read
      id-token: write # WIF exchange, so the firebase CLI can use ADC
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/app/frontend

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }} # projects/NUMBER/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: ${{ vars.WIF_SA_EMAIL }}
          export_environment_variables: true # sets GOOGLE_APPLICATION_CREDENTIALS for the firebase CLI

      - uses: google-github-actions/setup-gcloud@v2

      # `${{ }}` is substituted into the script text before the shell ever sees it, so a
      # value containing shell metacharacters becomes code rather than data. Passing it
      # through `env:` hands the shell a variable instead, which it cannot re-interpret.
      - name: Build
        working-directory: frontend
        env:
          URL: ${{ needs.deploy-backend.outputs.vite_api_url }}
        run: |
          test -n "$URL" || { echo "::error::vite_api_url is empty - backend job did not publish a URL"; exit 1; }
          echo "VITE_API_URL=$URL" > .env.production
          npm ci
          npm run build

      - name: Configure Firebase CLI
        run: npm install -g firebase-tools@14

      - name: Deploy to Firebase
        working-directory: frontend
        run: firebase deploy --only hosting --project "$PROJECT_ID" --non-interactive
