# .github/workflows/deploy.yml
name: Deploy to GCP

on:
  push:
    branches: []
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # wymagane dla OIDC

jobs:
#  changes:
#    outputs:
#      backend: ${{ steps.filter.outputs.backend }}
#      frontend: ${{ steps.filter.outputs.frontend }}
#      infra: ${{ steps.filter.outputs.infra }}
#    steps:
#      - uses: actions/checkout@v4
#      - uses: dorny/paths-filter@v3
#        id: filter
#        with:
#          filters: |
#            backend:
#              - 'backend/**'
#            frontend:
#              - 'frontend/**'
#            infra:
#              - 'infra/terraform/**'

  deploy-backend:
    #needs: changes
    runs-on: ubuntu-latest
    #if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.infra == 'true'
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/app/backend

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}   # projects/NUMBER/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: ${{ vars.WIF_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build & Push
        run: |
          docker build -t $IMAGE:${{ github.sha }} ./backend
          docker push $IMAGE:${{ github.sha }}

      - name: Terraform Apply
        working-directory: infra/terraform/main
        run: |
          terraform init
          terraform apply -auto-approve -var="image_tag=${{ github.sha }}" --var-file=../common.tfvars

      - name: Write frontend env
        run: |
          echo "VITE_API_URL=$(terraform -chdir=infra/terraform/main output -raw backend_url)" \
            > frontend/.env.production

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: [deploy-backend]
    #if: |
    #    always() &&
    #    needs.changes.outputs.frontend == 'true' &&
    #    (needs.deploy-backend.result == 'success' || needs.deploy-backend.result == 'skipped')
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/app/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}   # projects/NUMBER/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: ${{ vars.WIF_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build
        run: |
          echo "VITE_API_URL=${{ needs.deploy-backend.outputs.backend_url }}" > frontend/.env.production
          cd frontend && npm ci && npm run build

      - name: Deploy to Firebase
        run: npx firebase-tools deploy --only hosting --token ${{ secrets.FIREBASE_TOKEN }}
