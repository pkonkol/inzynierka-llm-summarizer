# Quality gates on every push, every branch.
#
# Deliberately not `pull_request`: work lands on master by manual squash merge, so there
# is often no PR to hang checks on. Pushing is the event that matters here.

name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

# A newer push makes the previous run irrelevant; cancelling saves Actions minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
