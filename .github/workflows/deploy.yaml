# .github/workflows/deploy.yml
name: Deploy to GCP

on:
  push:
    branches: []
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # wymagane dla OIDC

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: europe-west1
      IMAGE: europe-west1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/app/backend

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}   # projects/NUMBER/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: ${{ vars.WIF_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build & Push
        run: |
          docker build -t $IMAGE:${{ github.sha }} ./backend
          docker push $IMAGE:${{ github.sha }}

      - name: Terraform Apply
        working-directory: infra/terraform/main
        run: |
          terraform init
          terraform apply -auto-approve -var="image_tag=${{ github.sha }}" -var="project_id=${{ env.PROJECT_ID }}"